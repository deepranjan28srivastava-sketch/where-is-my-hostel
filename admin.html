<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Where Is My Hostel?</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            Where Is My Hostel?
        </div>

        <div class="subtitle">
            Admin Panel Login
        </div>

        <form id="adminLoginForm">

            <label for="adminEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >

            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

<script>
const SUPABASE_URL = "https://amjibqiukwkvcvgxucqg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fg49DIWK7aq1NGe9_RoRGA_hXiYq5CV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("adminLoginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    const message = document.getElementById("loginMessage");

    message.textContent = "Logging in...";
    message.style.color = "#6b7280";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error("ADMIN LOGIN ERROR:", error);

        message.textContent = "Invalid email or password.";
        message.style.color = "#dc2626";

        return;
    }

    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile || profile.role !== "admin") {

        await supabaseClient.auth.signOut();

        message.textContent = "You are not authorized as an admin.";
        message.style.color = "#dc2626";

        return;
    }

    message.textContent = "Login successful. Opening Admin Panel...";
    message.style.color = "#16a34a";

    setTimeout(() => {
        window.location.href = "admin-dashboard.html";
    }, 700);

});
</script>

</body>
</html>
