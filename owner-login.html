<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login — Where Is My Hostel?</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
            color: #111827;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #loginMessage {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>Where Is My Hostel?</h1>

        <div class="subtitle">
            Owner Portal Login
        </div>

        <form id="ownerLoginForm">

            <label for="ownerEmail">
                Email
            </label>

            <input
                id="ownerEmail"
                type="email"
                placeholder="Enter owner email"
                autocomplete="email"
                required
            >

            <label for="ownerPassword">
                Password
            </label>

            <input
                id="ownerPassword"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

        <a href="index.html" class="back-link">
            ← Back to Website
        </a>

    </div>


<script>

const SUPABASE_URL =
    "https://amjibqiukwkvcvgxucqg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_fg49DIWK7aq1NGe9_RoRGA_hXiYq5CV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


document
    .getElementById("ownerLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document
                .getElementById("ownerEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("ownerPassword")
                .value;

        const message =
            document
                .getElementById("loginMessage");

        message.textContent = "Logging in...";
        message.style.color = "#6b7280";


        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {

            console.error("OWNER LOGIN ERROR:", error);

            message.textContent =
                error.message || "Login failed.";

            message.style.color =
                "#dc2626";

            return;
        }


        console.log(
            "OWNER AUTH LOGIN SUCCESS:",
            data.user.email
        );


        message.textContent =
            "Login successful. Opening Owner Dashboard...";

        message.style.color =
            "#16a34a";


        setTimeout(function() {

            window.location.href =
                "owner.html";

        }, 700);

    });

</script>

</body>
</html>
