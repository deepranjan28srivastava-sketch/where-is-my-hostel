<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta
    name="description"
    content="Hostel and PG details in Kota."
>

<title>Hostel Details — Where Is My Hostel?</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --navy:#0b1230;
    --navy2:#18224d;
    --brand:#5b5cf0;
    --brand2:#7c7eff;
    --cyan:#20c7dc;

    --ink:#12182d;
    --muted:#6d768d;

    --bg:#f3f6fb;
    --white:#fff;

    --line:#e6e9f1;

    --green:#08764c;
    --green-bg:#eafaf2;

    --shadow:0 16px 45px rgba(18,27,66,.09);
    --shadow2:0 28px 90px rgba(8,14,40,.22);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    color:var(--ink);

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(124,126,255,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 95% 10%,
            rgba(32,199,220,.08),
            transparent 22%
        ),
        linear-gradient(
            180deg,
            #f8f9fd 0%,
            #f1f4f9 100%
        );

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;
}


button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}


/* =========================
   TOPBAR
========================= */

.topbar{
    position:sticky;

    top:0;

    z-index:100;

    background:rgba(255,255,255,.88);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid #e1e5ef;

    box-shadow:
        0 5px 22px rgba(19,26,57,.05);
}


.nav{
    max-width:1200px;

    margin:auto;

    padding:12px 18px;

    display:flex;

    align-items:center;

    gap:12px;
}


.brand{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:18px;

    font-weight:950;

    letter-spacing:-.4px;
}


.brand-mark{
    width:39px;

    height:39px;

    border-radius:13px;

    display:grid;

    place-items:center;

    color:white;

    background:
        linear-gradient(
            135deg,
            #8d8fff,
            #5b5cf0 55%,
            #3d40c8
        );

    box-shadow:
        0 10px 24px rgba(91,92,240,.25);
}


.back-btn{
    margin-left:auto;

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:9px 12px;

    border-radius:10px;

    color:#4549c9;

    background:#eff0ff;

    border:1px solid #dfe2ff;

    text-decoration:none;

    font-size:11px;

    font-weight:900;
}


/* =========================
   MAIN
========================= */

main{
    max-width:1200px;

    margin:auto;

    padding:26px 18px 60px;
}


/* =========================
   LOADING
========================= */

.loader{
    min-height:65vh;

    display:grid;

    place-items:center;
}


.spinner{
    width:38px;

    height:38px;

    border:4px solid #e7eaf2;

    border-top-color:var(--brand);

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}


@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   ERROR
========================= */

.error-box{
    max-width:650px;

    margin:80px auto;

    padding:28px;

    text-align:center;

    background:white;

    border:1px solid var(--line);

    border-radius:22px;

    box-shadow:var(--shadow);
}

.error-box h2{
    margin:0 0 8px;

    font-size:24px;
}

.error-box p{
    color:var(--muted);

    font-size:13px;

    line-height:1.6;
}


/* =========================
   HERO
========================= */

.property-hero{
    overflow:hidden;

    border-radius:28px;

    color:white;

    background:
        radial-gradient(
            circle at 85% 10%,
            rgba(124,126,255,.35),
            transparent 28%
        ),
        radial-gradient(
            circle at 95% 95%,
            rgba(32,199,220,.12),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #0b1230,
            #18224d 50%,
            #393db0
        );

    box-shadow:var(--shadow2);

    padding:34px;
}


.verified{
    display:inline-flex;

    padding:7px 10px;

    border-radius:999px;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.15);

    color:#dce1ff;

    font-size:9px;

    font-weight:950;

    letter-spacing:.12em;
}


.property-hero h1{
    margin:14px 0 7px;

    font-size:40px;

    line-height:1.08;

    letter-spacing:-1.7px;
}


.hero-sub{
    color:#dce2ff;

    font-size:13px;

    line-height:1.6;
}


.hero-price{
    margin-top:18px;

    font-size:26px;

    font-weight:950;
}


.hero-price small{
    color:#cfd5f8;

    font-size:11px;

    font-weight:700;
}


/* =========================
   FEATURE STRIP
========================= */

.quick-grid{
    margin-top:-22px;

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:10px;

    padding:0 20px;
}


.quick-card{
    padding:15px;

    background:white;

    border:1px solid var(--line);

    border-radius:15px;

    box-shadow:
        0 13px 36px rgba(22,31,68,.10);
}


.quick-icon{
    font-size:20px;

    margin-bottom:7px;
}


.quick-label{
    color:var(--muted);

    font-size:9px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.04em;
}


.quick-value{
    margin-top:4px;

    font-size:13px;

    font-weight:950;
}


/* =========================
   CONTENT
========================= */

.content-grid{
    display:grid;

    grid-template-columns:
        minmax(0,1.65fr)
        minmax(280px,.75fr);

    gap:18px;

    margin-top:28px;
}


.panel{
    background:white;

    border:1px solid var(--line);

    border-radius:20px;

    box-shadow:
        0 9px 28px rgba(31,38,72,.055);

    padding:20px;
}


.panel + .panel{
    margin-top:18px;
}


.panel h2{
    margin:0 0 5px;

    font-size:20px;

    letter-spacing:-.5px;
}


.panel-sub{
    color:var(--muted);

    font-size:11px;

    line-height:1.6;

    margin-bottom:15px;
}


/* =========================
   DETAILS
========================= */

.detail-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


.detail{
    padding:13px;

    border-radius:12px;

    background:#f8f9fc;

    border:1px solid var(--line);
}


.detail small{
    display:block;

    margin-bottom:5px;

    color:var(--muted);

    font-size:9px;

    font-weight:950;

    text-transform:uppercase;
}


.detail strong{
    font-size:13px;

    line-height:1.5;
}


/* =========================
   DESCRIPTION
========================= */

.text-block{
    color:#505a70;

    font-size:12px;

    line-height:1.75;

    white-space:pre-wrap;
}


/* =========================
   MAP
========================= */

.map-card{
    padding:16px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #f1f3ff,
            #eef8fa
        );

    border:1px solid #e0e4ef;
}


.map-address{
    margin-bottom:12px;

    color:#3e475c;

    font-size:12px;

    line-height:1.6;
}


/* =========================
   BUTTONS
========================= */

.btn{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    min-height:44px;

    padding:11px 14px;

    border-radius:12px;

    border:0;

    text-decoration:none;

    font-size:12px;

    font-weight:950;

    transition:.15s;
}


.btn:hover{
    transform:translateY(-1px);
}


.primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            #7c7eff,
            #5b5cf0 52%,
            #4548d7
        );

    box-shadow:
        0 11px 25px rgba(91,92,240,.20);
}


.secondary{
    color:#4649c9;

    background:#eff0ff;

    border:1px solid #dfe2ff;
}


.dark{
    color:white;

    background:#111937;
}


.button-row{
    display:flex;

    gap:9px;

    flex-wrap:wrap;
}


/* =========================
   COACHING
========================= */

.coaching-list{
    display:grid;

    gap:10px;
}


.coaching-item{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:13px;

    border-radius:13px;

    background:#f8f9fc;

    border:1px solid var(--line);
}


.coaching-name{
    font-size:12px;

    font-weight:900;
}


.coaching-distance{
    text-align:right;

    color:#5b6376;

    font-size:10px;

    white-space:nowrap;
}


/* =========================
   MESS
========================= */

.mess-box{
    padding:15px;

    border:1px solid #e3e6ee;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #f8fafc
        );
}


.mess-title{
    font-size:13px;

    font-weight:950;

    margin-bottom:5px;
}


/* =========================
   STICKY CTA
========================= */

.sticky-interest{
    position:sticky;

    bottom:14px;

    z-index:20;

    margin-top:18px;

    padding:12px;

    border-radius:18px;

    background:rgba(255,255,255,.90);

    backdrop-filter:blur(14px);

    border:1px solid rgba(220,224,235,.9);

    box-shadow:
        0 16px 45px rgba(15,22,53,.14);
}


.sticky-interest .btn{
    width:100%;

    min-height:50px;

    font-size:13px;
}


/* =========================
   FOOTER
========================= */

.footer{
    max-width:1200px;

    margin:auto;

    padding:0 18px 35px;

    text-align:center;

    color:#9aa2b2;

    font-size:10px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .content-grid{
        grid-template-columns:1fr;
    }

    .quick-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}


@media(max-width:650px){

    main{
        padding:16px 12px 45px;
    }

    .property-hero{
        padding:24px 20px;

        border-radius:23px;
    }

    .property-hero h1{
        font-size:31px;
    }

    .quick-grid{
        margin-top:12px;

        padding:0;

        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:17px;
    }

    .brand{
        font-size:14px;
    }

    .back-btn{
        font-size:10px;
    }
}
</style>
</head>


<body>


<header class="topbar">

    <div class="nav">

        <div class="brand">

            <span class="brand-mark">
                ⌂
            </span>

            <span>
                Where Is My Hostel?
            </span>

        </div>


        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to Search
        </a>

    </div>

</header>


<main id="app">


    <div class="loader">

        <div class="spinner"></div>

    </div>


</main>


<footer class="footer">

    Where Is My Hostel? • Kota accommodation discovery •
    Free for students.

</footer>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://amjibqiukwkvcvgxucqg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_fg49DIWK7aq1NGe9_RoRGA_hXiYq5CV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function propertyTypeLabel(type){

    return {

        boys_hostel:
            "Boys Hostel",

        girls_hostel:
            "Girls Hostel",

        boys_pg:
            "PG Boy",

        girls_pg:
            "PG Girl"

    }[type] ||
    "Hostel / PG";

}


function availabilityLabel(
    status,
    rooms
){

    if(
        rooms !== null &&
        rooms !== undefined
    ){

        const n =
            Number(rooms);

        if(
            Number.isFinite(n)
        ){

            if(n === 0){
                return "Full";
            }

            if(n <= 3){
                return "Limited";
            }

            return "Available";

        }

    }


    return {

        available:
            "Available",

        limited:
            "Limited",

        full:
            "Full",

        not_updated:
            "Not updated"

    }[status] ||
    "Not updated";

}


function formatDistance(
    meters
){

    if(
        meters === null ||
        meters === undefined
    ){
        return "";
    }


    const n =
        Number(meters);


    if(
        !Number.isFinite(n)
    ){
        return "";
    }


    if(n >= 1000){

        return (
            (n / 1000)
                .toFixed(1)
                .replace(".0","")
        ) +
        " km";

    }


    return Math.round(n) +
        " m";

}


function formatDuration(
    seconds
){

    if(!seconds){
        return "";
    }


    const n =
        Number(seconds);


    if(
        !Number.isFinite(n)
    ){
        return "";
    }


    return "~" +
        Math.max(
            1,
            Math.round(n / 60)
        ) +
        " min";

}


function mapsSearchURL(
    query
){

    return (
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query)
    );

}


function mapsRouteURL(
    origin,
    destination
){

    return (
        "https://www.google.com/maps/dir/?api=1&origin=" +
        encodeURIComponent(origin) +
        "&destination=" +
        encodeURIComponent(destination)
    );

}


/* =========================
   INTEREST PAGE
========================= */

function goToInterest(){

    const id =
        new URLSearchParams(
            window.location.search
        ).get("id");


    if(!id){
        return;
    }


    window.location.href =
        "index.html#interest-" +
        encodeURIComponent(id);

}


/* =========================
   LOAD HOSTEL
========================= */

async function loadHostel(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const hostelId =
        params.get("id");


    if(!hostelId){

        showError(
            "Hostel ID missing",
            "Please open the hostel from the student search page."
        );

        return;
    }


    const {
        data: hostel,
        error
    } =
        await supabaseClient
            .from("hostel_directory")
            .select(`
                id,
                hostel_name,
                address,
                property_type,
                room_type,
                rent_monthly,
                ac_available,
                balcony_available,
                food_available,
                wifi_available,
                available_rooms,
                availability_status,
                verification_status,
                management_status,
                hostel_rules,
                hostel_timing,
                description,
                claimed_owner_mobile,
                contact_visible_to_students,
                updated_at,
                area:areas(
                    id,
                    name
                )
            `)
            .eq(
                "id",
                hostelId
            )
            .eq(
                "is_active",
                true
            )
            .single();


    if(error){

        console.error(
            "HOSTEL LOAD ERROR:",
            error
        );


        showError(
            "Hostel not found",
            "This hostel may not be published anymore."
        );

        return;
    }


    renderHostel(
        hostel
    );

    loadCoachingDistances(
        hostel
    );

}


/* =========================
   RENDER HOSTEL
========================= */

function renderHostel(
    hostel
){

    const area =
        hostel.area?.name ||
        "Kota";


    const type =
        propertyTypeLabel(
            hostel.property_type
        );


    const availability =
        availabilityLabel(
            hostel.availability_status,
            hostel.available_rooms
        );


    const rent =
        hostel.rent_monthly
            ?
            `₹${Number(
                hostel.rent_monthly
            ).toLocaleString(
                "en-IN"
            )}`
            :
            "Rent not updated";


    const address =
        hostel.address ||
        `${hostel.hostel_name}, ${area}, Kota, Rajasthan`;


    const mapsUrl =
        mapsSearchURL(
            address
        );


    const messUrl =
        mapsSearchURL(
            `open mess near ${address}`
        );


    const details = [

        [
            "Property Type",
            type
        ],

        [
            "Room Type",
            hostel.room_type ||
            "Not updated"
        ],

        [
            "Monthly Rent",
            hostel.rent_monthly
                ?
                `₹${Number(
                    hostel.rent_monthly
                ).toLocaleString(
                    "en-IN"
                )} / month`
                :
                "Not updated"
        ],

        [
            "Available Rooms",
            hostel.available_rooms ??
            "Not updated"
        ],

        [
            "AC",
            hostel.ac_available === true
                ?
                "Available"
                :
                hostel.ac_available === false
                    ?
                    "Not available"
                    :
                    "Not updated"
        ],

        [
            "Balcony",
            hostel.balcony_available === true
                ?
                "Available"
                :
                hostel.balcony_available === false
                    ?
                    "Not available"
                    :
                    "Not updated"
        ],

        [
            "Food",
            hostel.food_available === true
                ?
                "Available"
                :
                hostel.food_available === false
                    ?
                    "Not available"
                    :
                    "Not updated"
        ],

        [
            "Wi-Fi",
            hostel.wifi_available === true
                ?
                "Available"
                :
                hostel.wifi_available === false
                    ?
                    "Not available"
                    :
                    "Not updated"
        ]

    ];


    document
        .getElementById("app")
        .innerHTML =

        `

        <!-- HERO -->

        <section class="property-hero">

            <div class="verified">

                ${
                    hostel.verification_status === "verified"
                        ?
                        "✓ VERIFIED LISTING"
                        :
                        "PUBLISHED LISTING"
                }

            </div>


            <h1>

                ${escapeHTML(
                    hostel.hostel_name
                )}

            </h1>


            <div class="hero-sub">

                📍

                ${escapeHTML(
                    area
                )}

                ·

                ${escapeHTML(
                    address
                )}

            </div>


            <div class="hero-price">

                ${escapeHTML(
                    rent
                )}

                ${
                    hostel.rent_monthly
                        ?
                        `<small>/ month</small>`
                        :
                        ""
                }

            </div>

        </section>



        <!-- QUICK FEATURES -->

        <section class="quick-grid">


            <div class="quick-card">

                <div class="quick-icon">
                    🏠
                </div>

                <div class="quick-label">
                    Property
                </div>

                <div class="quick-value">

                    ${escapeHTML(type)}

                </div>

            </div>


            <div class="quick-card">

                <div class="quick-icon">
                    🛏️
                </div>

                <div class="quick-label">
                    Room
                </div>

                <div class="quick-value">

                    ${escapeHTML(
                        hostel.room_type ||
                        "Not updated"
                    )}

                </div>

            </div>


            <div class="quick-card">

                <div class="quick-icon">
                    🚪
                </div>

                <div class="quick-label">
                    Availability
                </div>

                <div class="quick-value">

                    ${escapeHTML(
                        availability
                    )}

                </div>

            </div>


            <div class="quick-card">

                <div class="quick-icon">
                    📍
                </div>

                <div class="quick-label">
                    Area
                </div>

                <div class="quick-value">

                    ${escapeHTML(
                        area
                    )}

                </div>

            </div>


        </section>



        <!-- CONTENT -->

        <section class="content-grid">


            <!-- LEFT -->

            <div>


                <!-- DETAILS -->

                <div class="panel">

                    <h2>
                        Hostel Details
                    </h2>

                    <div class="panel-sub">
                        Everything currently available
                        in the listing.
                    </div>


                    <div class="detail-grid">

                        ${
                            details
                                .map(
                                    ([key,value]) =>
                                    `
                                    <div class="detail">

                                        <small>
                                            ${escapeHTML(
                                                key
                                            )}
                                        </small>

                                        <strong>
                                            ${escapeHTML(
                                                value
                                            )}
                                        </strong>

                                    </div>
                                    `
                                )
                                .join("")
                        }

                    </div>

                </div>



                <!-- ABOUT -->

                ${
                    hostel.description
                        ?
                        `
                        <div class="panel">

                            <h2>
                                About this Property
                            </h2>

                            <div class="text-block">

                                ${escapeHTML(
                                    hostel.description
                                )}

                            </div>

                        </div>
                        `
                        :
                        ""
                }



                <!-- RULES / TIMING -->

                ${
                    hostel.hostel_timing ||
                    hostel.hostel_rules
                        ?
                        `
                        <div class="panel">

                            <h2>
                                Rules & Timing
                            </h2>

                            ${
                                hostel.hostel_timing
                                    ?
                                    `
                                    <div
                                        class="info-row"
                                        style="
                                            margin-top:14px;
                                        "
                                    >

                                        <strong>
                                            🕐 Hostel Timing
                                        </strong>

/* =========================
   COACHING DISTANCES
========================= */

async function loadCoachingDistances(
    hostel
){

    const list =
        document.getElementById(
            "coachingList"
        );


    if(!list){
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "hostel_directory_coaching_distances"
            )
            .select(`
                hostel_id,
                coaching_id,
                distance_meters,
                duration_seconds,
                route_url
            `)
            .eq(
                "hostel_id",
                hostel.id
            );


    if(error){

        console.error(
            "COACHING DISTANCE ERROR:",
            error
        );


        list.innerHTML =
            `
            <div class="muted">
                Coaching distance data is not
                available for this property yet.
            </div>
            `;

        return;
    }


    if(
        !data ||
        !data.length
    ){

        list.innerHTML =
            `
            <div class="muted">
                Coaching distance data is not
                available for this property yet.
            </div>
            `;

        return;
    }


    const coachingIds =
        [
            ...new Set(
                data.map(
                    x =>
                        x.coaching_id
                )
            )
        ];


    const {
        data:coaching,
        error:coachingError
    } =
        await supabaseClient
            .from(
                "coaching_centres"
            )
            .select(
                "id,name"
            )
            .in(
                "id",
                coachingIds
            );


    if(coachingError){

        console.error(
            coachingError
        );

        list.innerHTML =
            `
            <div class="muted">
                Coaching information could not
                be loaded.
            </div>
            `;

        return;
    }


    const coachingMap =
        new Map(
            (coaching || [])
                .map(
                    item => [
                        String(item.id),
                        item.name
                    ]
                )
        );


    list.innerHTML =
        data
            .map(
                item => {

                    const name =
                        coachingMap.get(
                            String(
                                item.coaching_id
                            )
                        ) ||
                        "Coaching Centre";


                    const distance =
                        formatDistance(
                            item.distance_meters
                        );


                    const duration =
                        formatDuration(
                            item.duration_seconds
                        );


                    const origin =
                        hostel.address ||
                        `${hostel.hostel_name},
                         ${hostel.area?.name || "Kota"},
                         Kota, Rajasthan`;


                    const destination =
                        `${name},
                         Kota, Rajasthan`;


                    const route =
                        item.route_url ||
                        mapsRouteURL(
                            origin,
                            destination
                        );


                    return `

                    <div class="coaching-item">

                        <div>

                            <div class="coaching-name">

                                🎓
                                ${escapeHTML(
                                    name
                                )}

                            </div>

                        </div>


                        <div class="coaching-distance">

                            ${
                                distance
                                    ?
                                    escapeHTML(
                                        distance
                                    )
                                    :
                                    "Distance unavailable"
                            }

                            ${
                                duration
                                    ?
                                    `<br>${escapeHTML(
                                        duration
                                    )}`
                                    :
                                    ""
                            }

                            <br>

                            <a
                                href="${escapeHTML(
                                    route
                                )}"
                                target="_blank"
                                rel="noopener noreferrer"
                                style="
                                    color:#4a4ed0;
                                    text-decoration:none;
                                    font-weight:900;
                                "
                            >
                                Route →
                            </a>

                        </div>

                    </div>

                    `;

                }
            )
            .join("");

}
